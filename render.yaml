services:
  - type: web
    name: baaki-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://baaki-frontend.vercel.app
      - key: DATABASE_PATH
        value: ./baaki.db
      - key: DEMO_MODE
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
